<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイピングゲーム</title>

<style>
    
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 0;
    font-family: sans-serif;
    color: white;
    background: #181824;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    min-height: 100vh;
}

.game {
    width: 95%;
    max-width: 1200px;
    min-height: 400px;
    height: auto;

    background: #2b2b40;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    text-align: center;

    position: relative;
    margin: 0 auto;
}

h1 {
    margin-top: 0;
}

#word {
    font-size: 30px;
    margin: 30px 0;
    letter-spacing: 3px;
    overflow-wrap: anywhere;
}

#word_2 {
    font-size: 20px;
    letter-spacing: 0.1em;
    overflow-wrap: anywhere;
}

#input {
    width: 80%;
    max-width: 100%;
    padding: 15px;
    font-size: 24px;
    border: none;
    border-radius: 10px;
    outline: none;
}

.info {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
    font-size: 22px;
}

#message {
    margin-top: 20px;
    font-size: 28px;
    color: #ffd966;
}

/* ゲーム画面の下に表示するキーボード */
.key {
    width: 100%;
    max-width: 850px;
    margin: 30px auto 10px;
}

/* キーを横12列に並べる */
.key_grid,
.key_grid_2 {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 5px;
    width: 100%;
}

/* 各キーの見た目 */
.b {
    min-width: 0;
    min-height: 42px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 6px;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: opacity 0.05s;
}

.b p {
    margin: 0;
    font-size: 15px;
    overflow-wrap: anywhere;
}

/* キーボードの段ごとの位置調整 */
.a1 {
    width: 94%;
    margin: 6px auto 0;
}

.a2 {
    width: 88%;
    margin: 6px auto 0;
}

/* ボタン */
button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #4caf50;
    color: white;
}

button:hover {
    background: #45a049;
}

/* 画面が狭い場合 */
@media (max-width: 600px) {
    .game {
        padding: 15px 8px;
    }

    #word {
        font-size: 20px;
    }

    #word_2 {
        font-size: 14px;
        letter-spacing: 0;
    }

    #input {
        width: 95%;
        font-size: 18px;
    }

    .key_grid,
    .key_grid_2 {
        gap: 2px;
    }

    .b {
        min-height: 30px;
        border-radius: 3px;
    }

    .b p {
        font-size: 10px;
    }
}

    
</style>

</head>
<body>

<div class="game">
    <h1 class="a">⌨ タイピングゲーム</h1>

    <p>残り時間内にレポートを書き切れ！</p>

    <div id="word">start</div>
    <div id="word_2" ></div>

    <input type="text" id="input" autocomplete="off">

    <div class="info">
        <div>残り: <span id="score">0</span></div>
        <div>残り時間: <span id="time">30</span></div>
    </div>

    <div id="message"></div>
<div id="app">
   
        <p style="margin-top: 10px; ">正答率 <span v-if="score_v[0]">{{ score_v[1] }}%</span></p>
    
    
    <button @click="startGame()">ゲーム</button>



    <div class="key">

        <div class="key_grid">
            <div v-for="s in key_data[0]" :key="s">
                <div class="b" :style="{background: s[1], opacity: s[2] }">
                    <p>{{ s[0] }}</p>
                </div>
            </div>
        </div>

        <div class="a1">
            <div class="key_grid_2">
            <div v-for="s in key_data[1]" :key="s">
                <div class="b" :style="{background: s[1], opacity: s[2] }">
                    <p>{{ s[0] }}</p>
                </div>
            </div>
        </div>
        </div>
        <br>
        <br>
       
        <div class="a2" style="margin-top: 10px;">
            <div class="key_grid">
            <div v-for="s in key_data[2]" :key="s">
                <div class="b" :style="{background: s[1], opacity: s[2] }">
                    <p>{{ s[0] }}</p>
                </div>
            </div>
        </div>
        </div>
        
    </div>
    

    <!-- <div class="key_grid">
        <div v-for="s in key_data[1]" :key="s">
            <div class="b" :style="{background: s[1], opacity: s[2] }">
                <p>{{ s[0] }}</p>
            </div>
        </div>
    </div> -->
    
</div>
<link rel="stylesheet" href="tai.css";>
<script type="module">

    createApp({

    [

    ],
    [

    ],
    [
        "持続可能な社会の実現が求められている。",
        "jizokukanounashakainojitsugengamotomerareteiru"
    ],
    [
        "データ分析によって傾向を把握することができる。",
        "de-tabunseiniyottekoukeiwahakusurukotogadekiru"

    [

let currentWord = "";
let score = 5;
let time = 30;
let timer;
let word_f = 0;
const score_v = ref([false, 0, 0]);
let w = "";

const wordDisplay = document.getElementById("word");
const input = document.getElementById("input");
const scoreDisplay = document.getElementById("score");
const timeDisplay = document.getElementById("time");
const message = document.getElementById("message");
const wd = document.getElementById("word_2");

function randomWord(){
//console.log(Math.floor(Math.random() * words.length));
    const a = Math.floor(Math.random() * words.length);
    word_f = words[a][1].length;
    w = words[a][0];
    
    return words[a][1];
}

function showWord(){
    currentWord = randomWord();
    wordDisplay.textContent = currentWord;
    wd.textContent = w;
}

const startGame = () => {
    console.log("ゲーム開始");
    score = 8;
    time = 90;
    score_v.value[0] = false;
    score_v.value[1] = 0;
    score_v.value[2] = 0;

    scoreDisplay.textContent = score;
    timeDisplay.textContent = time;
    message.textContent = "";

    showWord();

    input.value = "";
    input.focus();

    clearInterval(timer);

    timer = setInterval(() => {
        if(score_v.value[0] === false) {
            time--;console.log(score_v.value[0]);
        } 
        
        timeDisplay.textContent = time;

        if(time <= 0){
            
            clearInterval(timer);
            endGame();
            
        }
    }, 1000);
}

input.addEventListener("input", () => {
    if(input.value.length === currentWord.length){
        score--;
        for (const [index, i] of [...currentWord].entries()) {
            console.log(index, i);
            score_v.value[2]++;
            if (input.value[index] === i) {
                score_v.value[1]++;
                
            }
        }
        
        
        if (score === 0) {
            endGame();
        }
        scoreDisplay.textContent = score;

        input.value = "";

        
        timeDisplay.textContent = time;

        showWord();
        
    }
});

function endGame(){
    wordDisplay.textContent = "終了！";
    message.textContent = "ゲームクリア";
    score_v.value[1] = score_v.value[1] / score_v.value[2];
    score_v.value[1] = Math.floor(score_v.value[1] * 100);
    console.log(score_v.value[1] , score_v.value[2]);
    score_v.value[0] = true;
}

const key_data = ref([[["q", "blue", 0.3],["w", "green", 0.3],["e", "yellow", 0.3],["r", "red", 0.3],["t", "red", 0.3],["y", "red", 0.3],["u", "red", 0.3],["i", "yellow", 0.3],["o", "green", 0.3],["p", "blue", 0.3],["@", "bule", 0.3],["[", "blue", 0.3]],
                    [["a", "blue", 0.3],["s", "green", 0.3],["d", "yellow", 0.3],["f", "red", 0.3],["g", "red", 0.3],["h", "red", 0.3],["j", "red", 0.3],["k", "yellow", 0.3],["l", "green", 0.3],[";", "blue", 0.3],[":", "bule", 0.3],["]", "blue", 0.3]],
                    [["z", "blue", 0.3],["x", "green", 0.3],["c", "yellow", 0.3],["v", "red", 0.3],["b", "red", 0.3],["n", "red", 0.3],["m", "red", 0.3],[",", "yellow", 0.3],[".", "green", 0.3],["/", "blue", 0.3],["", "bule", 0.3],["shft", "blue", 0.3]]]);


document.addEventListener("keydown", (event) => {
    key_data.value.forEach((i) => {
        i.forEach((num) => {
    if (event.key === num[0]) {
      num[2] = 1;
    }
  });
    })
  
});

document.addEventListener('keyup', (event) => {
    key_data.value.forEach((i) => {
        i.forEach((num) => {
    if (event.key === num[0]) {
      num[2] = 0.3;
    }
  });
    })
    
});
return {
    key_data,
    startGame,
    score_v
}
        }
    }).mount("#app");



</script>

</body>
</html>
